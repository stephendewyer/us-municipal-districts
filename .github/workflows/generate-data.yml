name: Generate municipal data

on:

  workflow_dispatch:

  schedule:
    - cron: "0 7 1 * *"

jobs:

  generate:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Discover candidates
        run: npm run discover

      - name: Build data
        run: npm run generate

      - name: Validate
        run: npm run check

      - name: Show changes
        run: git status --short