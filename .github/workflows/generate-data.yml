name: Generate municipal data

on:
  workflow_dispatch:

  schedule:
    - cron: "0 7 1 * *"

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Discover municipal district sources
        run: npm run discover

      - name: Generate municipal geometry
        run: npm run generate

      - name: Validate registry
        run: npm run validate

      - name: Run tests
        run: npm run check

      - name: Show generated changes
        run: git status --short