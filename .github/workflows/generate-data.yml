name: Generate municipal data

on:
  workflow_dispatch:
    inputs:
      city:
        description: "City to process (leave blank for nationwide discovery)"
        required: false
        default: ""
        type: string

      state:
        description: "Two-letter state abbreviation (leave blank for nationwide discovery)"
        required: false
        default: ""
        type: string

  schedule:
    - cron: "0 7 1 * *"

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Show generation mode
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "Generation mode: nationwide scheduled run"
          elif [ -n "${{ inputs.city }}" ] || [ -n "${{ inputs.state }}" ]; then
            echo "Generation mode: targeted manual run"
            echo "City: ${{ inputs.city }}"
            echo "State: ${{ inputs.state }}"
          else
            echo "Generation mode: nationwide manual run"
          fi

      - name: Discover municipal district sources
        shell: bash
        run: |
          args=()

          if [ -n "${{ inputs.city }}" ]; then
            args+=(--city "${{ inputs.city }}")
          fi

          if [ -n "${{ inputs.state }}" ]; then
            args+=(--state "${{ inputs.state }}")
          fi

          if [ ${#args[@]} -eq 0 ]; then
            npm run discover
          else
            npm run discover -- "${args[@]}"
          fi

      - name: Generate municipal geometry
        shell: bash
        run: |
          args=()

          if [ -n "${{ inputs.city }}" ]; then
            args+=(--city "${{ inputs.city }}")
          fi

          if [ -n "${{ inputs.state }}" ]; then
            args+=(--state "${{ inputs.state }}")
          fi

          if [ ${#args[@]} -eq 0 ]; then
            npm run generate
          else
            npm run generate -- "${args[@]}"
          fi

      - name: Validate registry and geometry
        run: npm run validate

      - name: Run tests
        run: npm run check

      - name: Show generated changes
        run: |
          echo "=== Git status ==="
          git status --short

          echo ""
          echo "=== Registry diff ==="
          git diff -- data/municipalities/registry.json

          echo ""
          echo "=== Geometry changes ==="
          git diff --stat -- data/geometry