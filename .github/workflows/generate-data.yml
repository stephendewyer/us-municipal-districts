name: Generate municipal data

on:
  workflow_dispatch:
    inputs:
      city:
        description: "City to process (leave blank for nationwide discovery)"
        required: false
        default: ""
        type: string

      state:
        description: "Two-letter state abbreviation (leave blank for nationwide discovery)"
        required: false
        default: ""
        type: string

  schedule:
    - cron: "0 7 1 * *"


# Prevent overlapping nationwide/manual generation runs from
# modifying the generated dataset simultaneously.
concurrency:
  group: generate-municipal-data
  cancel-in-progress: false


# The workflow needs permission to commit generated data.
permissions:
  contents: write


jobs:
  generate:
    runs-on: ubuntu-latest

    steps:

      # -----------------------------------------------------------------------
      # Checkout
      # -----------------------------------------------------------------------

      - name: Checkout
        uses: actions/checkout@v7


      # -----------------------------------------------------------------------
      # Node
      # -----------------------------------------------------------------------

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm


      # -----------------------------------------------------------------------
      # Install
      # -----------------------------------------------------------------------

      - name: Install dependencies
        run: npm ci


      # -----------------------------------------------------------------------
      # Show generation mode
      # -----------------------------------------------------------------------

      - name: Show generation mode
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "Generation mode: nationwide scheduled run"
          elif [ -n "${{ inputs.city }}" ] || [ -n "${{ inputs.state }}" ]; then
            echo "Generation mode: targeted manual run"
            echo "City: ${{ inputs.city }}"
            echo "State: ${{ inputs.state }}"
          else
            echo "Generation mode: nationwide manual run"
          fi


      # -----------------------------------------------------------------------
      # Discover
      # -----------------------------------------------------------------------

      - name: Discover municipal district sources
        shell: bash
        run: |
          args=()

          if [ -n "${{ inputs.city }}" ]; then
            args+=(--city "${{ inputs.city }}")
          fi

          if [ -n "${{ inputs.state }}" ]; then
            args+=(--state "${{ inputs.state }}")
          fi

          if [ ${#args[@]} -eq 0 ]; then
            npm run discover
          else
            npm run discover -- "${args[@]}"
          fi


      # -----------------------------------------------------------------------
      # Generate
      # -----------------------------------------------------------------------

      - name: Generate municipal geometry
        shell: bash
        run: |
          args=()

          if [ -n "${{ inputs.city }}" ]; then
            args+=(--city "${{ inputs.city }}")
          fi

          if [ -n "${{ inputs.state }}" ]; then
            args+=(--state "${{ inputs.state }}")
          fi

          if [ ${#args[@]} -eq 0 ]; then
            npm run generate
          else
            npm run generate -- "${args[@]}"
          fi


      # -----------------------------------------------------------------------
      # Validate
      # -----------------------------------------------------------------------

      - name: Validate registry and geometry
        run: npm run validate


      # -----------------------------------------------------------------------
      # Test
      # -----------------------------------------------------------------------

      - name: Run tests
        run: npm run check


      # -----------------------------------------------------------------------
      # Show changes
      # -----------------------------------------------------------------------

      - name: Show generated changes
        run: |
          echo "=== Git status ==="
          git status --short

          echo ""
          echo "=== Generated data diff ==="
          git diff -- \
            data/municipalities/registry.json \
            data/geometry

          echo ""
          echo "=== Generated data diff stat ==="
          git diff --stat -- \
            data/municipalities/registry.json \
            data/geometry


      # -----------------------------------------------------------------------
      # Commit generated changes
      # -----------------------------------------------------------------------

      - name: Commit generated data
        shell: bash
        run: |
          git add \
            data/municipalities/registry.json \
            data/geometry

          if git diff --cached --quiet; then
            echo "No generated data changes detected."
            exit 0
          fi

          echo "Generated data changes detected."

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git commit \
            -m "Update generated municipal data"

          git push